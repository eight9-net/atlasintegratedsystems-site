<svg xmlns="http://www.w3.org/2000/svg" width="600" height="90" viewBox="0 0 600 90">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0077aa"/>
    </linearGradient>
  </defs>

  <!-- Globe icon (no background — transparent for header use) -->
  <g transform="translate(45,45)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="36" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.85"/>

    <!-- Latitude arcs -->
    <ellipse cx="0" cy="-11" rx="33" ry="10" fill="none" stroke="#00b4d8" stroke-width="1.2" opacity="0.45"/>
    <ellipse cx="0" cy="11" rx="33" ry="10" fill="none" stroke="#00b4d8" stroke-width="1.2" opacity="0.45"/>

    <!-- Longitude arcs -->
    <ellipse cx="0" cy="0" rx="13" ry="36" fill="none" stroke="#00b4d8" stroke-width="1.2" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="26" ry="36" fill="none" stroke="#00b4d8" stroke-width="1.2" opacity="0.35"/>

    <!-- Axis lines -->
    <line x1="0" y1="-38" x2="0" y2="38" stroke="#00b4d8" stroke-width="0.8" opacity="0.25"/>
    <line x1="-38" y1="0" x2="38" y2="0" stroke="#00b4d8" stroke-width="0.8" opacity="0.25"/>

    <!-- Cardinal nodes -->
    <circle cx="0" cy="-36" r="2.5" fill="#00d4ff" opacity="0.9"/>
    <circle cx="0" cy="36" r="2.5" fill="#00d4ff" opacity="0.9"/>
    <circle cx="-36" cy="0" r="2.5" fill="#00d4ff" opacity="0.9"/>
    <circle cx="36" cy="0" r="2.5" fill="#00d4ff" opacity="0.9"/>

    <!-- Equator nodes -->
    <circle cx="-22" cy="0" r="1.8" fill="#00d4ff" opacity="0.6"/>
    <circle cx="-9" cy="0" r="1.8" fill="#00d4ff" opacity="0.6"/>
    <circle cx="9" cy="0" r="1.8" fill="#00d4ff" opacity="0.6"/>
    <circle cx="22" cy="0" r="1.8" fill="#00d4ff" opacity="0.6"/>

    <!-- Center node -->
    <circle cx="0" cy="0" r="3" fill="#00d4ff" opacity="0.95"/>
    <circle cx="0" cy="0" r="5.5" fill="#00d4ff" opacity="0.12"/>
  </g>

  <!-- Company name -->
  <text x="100" y="35" font-family="'Arial Black',Arial,sans-serif" font-weight="900" fill="#ffffff" opacity="0.95">
    <tspan font-size="30" letter-spacing="5">ATLAS</tspan>
    <tspan font-size="22" letter-spacing="1.5" font-family="Arial,sans-serif" font-weight="400" dx="6" opacity="0.9">INTEGRATED SYSTEMS, INC.</tspan>
  </text>

  <!-- Tagline -->
  <text x="100" y="58" font-family="Arial,sans-serif" font-size="14" fill="#00b4d8" letter-spacing="3" opacity="0.8">Communications Systems Design</text>
  <text x="100" y="77" font-family="Arial,sans-serif" font-size="14" fill="#00b4d8" letter-spacing="3" opacity="0.8">Engineering and Installation</text>
</svg>

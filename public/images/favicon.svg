<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060e24"/>
      <stop offset="100%" stop-color="#05176c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0077aa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>

  <!-- Globe outer ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.85"/>

  <!-- Latitude arcs -->
  <ellipse cx="32" cy="23" rx="27" ry="8" fill="none" stroke="#00b4d8" stroke-width="1.1" opacity="0.45"/>
  <ellipse cx="32" cy="41" rx="27" ry="8" fill="none" stroke="#00b4d8" stroke-width="1.1" opacity="0.45"/>

  <!-- Longitude arcs -->
  <ellipse cx="32" cy="32" rx="11" ry="29" fill="none" stroke="#00b4d8" stroke-width="1.1" opacity="0.5"/>
  <ellipse cx="32" cy="32" rx="21" ry="29" fill="none" stroke="#00b4d8" stroke-width="1.1" opacity="0.35"/>

  <!-- Axis lines -->
  <line x1="32" y1="2" x2="32" y2="62" stroke="#00b4d8" stroke-width="0.8" opacity="0.25"/>
  <line x1="2" y1="32" x2="62" y2="32" stroke="#00b4d8" stroke-width="0.8" opacity="0.25"/>

  <!-- Cardinal nodes -->
  <circle cx="32" cy="3" r="2.2" fill="#00d4ff" opacity="0.9"/>
  <circle cx="32" cy="61" r="2.2" fill="#00d4ff" opacity="0.9"/>
  <circle cx="3" cy="32" r="2.2" fill="#00d4ff" opacity="0.9"/>
  <circle cx="61" cy="32" r="2.2" fill="#00d4ff" opacity="0.9"/>

  <!-- Equator nodes -->
  <circle cx="11" cy="32" r="1.6" fill="#00d4ff" opacity="0.6"/>
  <circle cx="21" cy="32" r="1.6" fill="#00d4ff" opacity="0.6"/>
  <circle cx="43" cy="32" r="1.6" fill="#00d4ff" opacity="0.6"/>
  <circle cx="53" cy="32" r="1.6" fill="#00d4ff" opacity="0.6"/>

  <!-- Center node -->
  <circle cx="32" cy="32" r="3" fill="#00d4ff" opacity="0.95"/>
  <circle cx="32" cy="32" r="5.5" fill="#00d4ff" opacity="0.12"/>
</svg>

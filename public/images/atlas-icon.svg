<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060e24"/>
      <stop offset="100%" stop-color="#05176c"/>
    </linearGradient>
    <linearGradient id="globeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0077aa"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#005f80"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bgGrad)"/>

  <!-- Outer globe ring -->
  <circle cx="256" cy="240" r="145" fill="none" stroke="url(#globeGrad)" stroke-width="4" opacity="0.8"/>

  <!-- Latitude arcs (horizontal ellipses) -->
  <ellipse cx="256" cy="195" rx="130" ry="38" fill="none" stroke="#00b4d8" stroke-width="2.5" opacity="0.45"/>
  <ellipse cx="256" cy="285" rx="130" ry="38" fill="none" stroke="#00b4d8" stroke-width="2.5" opacity="0.45"/>

  <!-- Longitude arcs (vertical ellipses, tilted) -->
  <ellipse cx="256" cy="240" rx="50" ry="145" fill="none" stroke="#00b4d8" stroke-width="2.5" opacity="0.5"/>
  <ellipse cx="256" cy="240" rx="105" ry="145" fill="none" stroke="#00b4d8" stroke-width="2.5" opacity="0.35" transform="rotate(0,256,240)"/>

  <!-- Vertical axis line -->
  <line x1="256" y1="93" x2="256" y2="387" stroke="#00b4d8" stroke-width="2" opacity="0.3"/>
  <!-- Horizontal axis line -->
  <line x1="109" y1="240" x2="403" y2="240" stroke="#00b4d8" stroke-width="2" opacity="0.3"/>

  <!-- Network nodes at key intersections -->
  <!-- Top -->
  <circle cx="256" cy="95" r="7" fill="#00d4ff" opacity="0.9"/>
  <!-- Bottom -->
  <circle cx="256" cy="385" r="7" fill="#00d4ff" opacity="0.9"/>
  <!-- Left -->
  <circle cx="111" cy="240" r="7" fill="#00d4ff" opacity="0.9"/>
  <!-- Right -->
  <circle cx="401" cy="240" r="7" fill="#00d4ff" opacity="0.9"/>

  <!-- Intersection nodes on upper latitude -->
  <circle cx="175" cy="195" r="5.5" fill="#00d4ff" opacity="0.7"/>
  <circle cx="256" cy="195" r="5.5" fill="#00d4ff" opacity="0.7"/>
  <circle cx="337" cy="195" r="5.5" fill="#00d4ff" opacity="0.7"/>

  <!-- Intersection nodes on lower latitude -->
  <circle cx="175" cy="285" r="5.5" fill="#00d4ff" opacity="0.7"/>
  <circle cx="256" cy="285" r="5.5" fill="#00d4ff" opacity="0.7"/>
  <circle cx="337" cy="285" r="5.5" fill="#00d4ff" opacity="0.7"/>

  <!-- Intersection nodes on equator -->
  <circle cx="153" cy="240" r="5.5" fill="#00d4ff" opacity="0.7"/>
  <circle cx="206" cy="240" r="5.5" fill="#00d4ff" opacity="0.7"/>
  <circle cx="306" cy="240" r="5.5" fill="#00d4ff" opacity="0.7"/>
  <circle cx="359" cy="240" r="5.5" fill="#00d4ff" opacity="0.7"/>

  <!-- Center node (brightest) -->
  <circle cx="256" cy="240" r="9" fill="#00d4ff" opacity="0.95"/>
  <circle cx="256" cy="240" r="15" fill="#00d4ff" opacity="0.15"/>

  <!-- Glow halos on cardinal nodes -->
  <circle cx="256" cy="95" r="14" fill="#00d4ff" opacity="0.1"/>
  <circle cx="256" cy="385" r="14" fill="#00d4ff" opacity="0.1"/>
  <circle cx="111" cy="240" r="14" fill="#00d4ff" opacity="0.1"/>
  <circle cx="401" cy="240" r="14" fill="#00d4ff" opacity="0.1"/>

  <!-- "ATLAS" text below globe -->
  <text x="256" y="440" font-family="'Arial Black',Arial,sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="12" opacity="0.95">ATLAS</text>
  <text x="256" y="470" font-family="Arial,sans-serif" font-size="18" fill="#00b4d8" text-anchor="middle" letter-spacing="8" opacity="0.8">INTEGRATED SYSTEMS</text>
</svg>
